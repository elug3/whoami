name: CI

on: 
  push:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Download go modules
        run: go mod download
      
      - name: Run tests
        run: go test ./...
      
      - name: Build binary
        run: go build -o sum
    